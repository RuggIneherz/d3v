name: Mirror to Gitee

# 把本仓库镜像到 Gitee，方便国内网络直接安装：
#   SillyTavern → 扩展 → Install extension → https://gitee.com/RuggIneherz/d3v
# 触发：main 有新提交 / 每天一次兜底 / 手动。
# 注意：--force 只作用于 Gitee 镜像仓库（镜像本就需要与源一致）；
#      来源仓库（GitHub）永远是普通提交，不会被改写。

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * *' # 每天 04:00（北京时间）兜底同步一次
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GITEE_REPO: RuggIneherz/d3v # 目标镜像仓库（owner/repo）
    steps:
      - name: 检出完整历史与全部分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送到 Gitee 镜像
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::缺少 GITEE_TOKEN secret，请在仓库 Settings → Secrets and variables → Actions 里添加"
            exit 1
          fi

          GITEE_USER="${GITEE_REPO%%/*}"
          URL_BASE="gitee.com/${GITEE_REPO}.git"

          # 先看远端现有分支，便于判断默认分支
          echo "远端现有引用："
          git ls-remote "https://${GITEE_USER}:${GITEE_TOKEN}@${URL_BASE}" | head -n 10 || true

          # Gitee 的私人令牌两种写法都有人用（用户名+令牌 / oauth2+令牌），依次尝试
          push_all() {
            local user="$1"
            git remote remove gitee 2>/dev/null || true
            git remote add gitee "https://${user}:${GITEE_TOKEN}@${URL_BASE}"
            # 分支与标签一起推；--prune 让源仓库删掉的分支在镜像里也消失
            git push --force --prune gitee "refs/remotes/origin/*:refs/heads/*"
            git push --force gitee --tags
          }

          if push_all "${GITEE_USER}"; then
            echo "✅ 已用「用户名 + 令牌」同步到 gitee.com/${GITEE_REPO}"
          elif push_all "oauth2"; then
            echo "✅ 已用「oauth2 + 令牌」同步到 gitee.com/${GITEE_REPO}"
          else
            echo "::error::推送到 Gitee 失败：请确认 GITEE_TOKEN 有效、且令牌具备 projects 权限"
            exit 1
          fi

      - name: 同步结果
        run: |
          echo "源提交： $(git rev-parse HEAD)"
          echo "镜像地址：https://gitee.com/${GITEE_REPO}"
          echo "安装地址（SillyTavern → 扩展 → Install extension）："
          echo "  https://gitee.com/${GITEE_REPO}"
